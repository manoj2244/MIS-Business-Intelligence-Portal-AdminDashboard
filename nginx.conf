server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle /admin path — matches vite base '/admin/' and BrowserRouter basename="/admin"
    location /admin {
        try_files $uri $uri/ /index.html;
    }

    # Redirect root to /admin
    location = / {
        return 301 /admin;
    }
}
