server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets are physically at /assets/ but index.html requests them as /admin/assets/
    location /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    # vite.svg requested as /admin/vite.svg
    location /admin/vite.svg {
        alias /usr/share/nginx/html/vite.svg;
    }

    # All /admin/* routes → serve index.html (React Router handles routing)
    location /admin {
        try_files $uri $uri/ /index.html;
    }

    # Redirect root to /admin
    location = / {
        return 301 /admin;
    }
}
